name: Release

# One v* tag releases erlmark, erlmark_ex and erlmark_gleam at the same version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28"
          elixir-version: "1.19"
          gleam-version: "1.17.0"
          rebar3-version: "3"
      - name: Tag matches the version of all three packages
        run: |
          erl_vsn=$(sed -n 's/.*{vsn, "\(.*\)"}.*/\1/p' src/erlmark.app.src)
          ex_vsn=$(sed -n 's/^ *@version "\(.*\)"/\1/p' elixir/mix.exs)
          gl_vsn=$(sed -n 's/^version = "\(.*\)"/\1/p' gleam/gleam.toml)
          echo "tag=${GITHUB_REF_NAME} erlmark=$erl_vsn erlmark_ex=$ex_vsn erlmark_gleam=$gl_vsn"
          test "v$erl_vsn" = "${GITHUB_REF_NAME}" && test "$ex_vsn" = "$erl_vsn" && test "$gl_vsn" = "$erl_vsn" || { echo "versions out of sync"; exit 1; }
      - run: rebar3 fmt --check
      - run: rebar3 eunit
      - run: rebar3 dialyzer
      - run: rebar3 ex_doc
      - name: Elixir package (against the sibling sources)
        working-directory: elixir
        env:
          ERLMARK_PATH: ..
        run: |
          mix deps.get
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix test
      - name: Gleam package (against the latest published erlmark)
        working-directory: gleam
        run: |
          sed -i 's/^erlmark = .*/erlmark = ">= 0.1.1 and < 1.0.0"/' gleam.toml
          gleam deps download
          gleam format --check src test
          gleam test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Holds HEX_API_KEY; the environment requires a reviewer to approve.
    environment: hex
    permissions:
      contents: write
    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
      HEXPM_API_KEY: ${{ secrets.HEX_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28"
          elixir-version: "1.19"
          gleam-version: "1.17.0"
          rebar3-version: "3"
      # Hex may stage a new release until it is approved in the Hex dashboard, so each
      # step skips a version that is already there, and the wrappers (which depend on
      # exactly this version) wait up to an hour for the approval.
      - name: Publish erlmark
        run: |
          vsn=${GITHUB_REF_NAME#v}
          if curl -fsS "https://hex.pm/api/packages/erlmark/releases/$vsn" >/dev/null; then
            echo "erlmark $vsn is already on Hex"
          else
            rebar3 hex publish --yes
          fi
      - name: Publish erlmark_ex
        working-directory: elixir
        run: |
          vsn=${GITHUB_REF_NAME#v}
          if curl -fsS "https://hex.pm/api/packages/erlmark_ex/releases/$vsn" >/dev/null; then
            echo "erlmark_ex $vsn is already on Hex"
            exit 0
          fi
          for i in $(seq 1 360); do mix deps.get && ok=1 && break; sleep 10; done
          test -n "$ok"
          mix hex.publish --yes
      - name: Publish erlmark_gleam
        working-directory: gleam
        run: |
          vsn=${GITHUB_REF_NAME#v}
          if curl -fsS "https://hex.pm/api/packages/erlmark_gleam/releases/$vsn" >/dev/null; then
            echo "erlmark_gleam $vsn is already on Hex"
            exit 0
          fi
          for i in $(seq 1 360); do gleam deps download && ok=1 && break; sleep 10; done
          test -n "$ok"
          # Gleam asks for this phrase before publishing a 0.x version; --yes does not cover it.
          printf 'I am not using semantic versioning\n' | gleam publish --yes
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
