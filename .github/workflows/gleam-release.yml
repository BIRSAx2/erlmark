name: Release Gleam package

on:
  push:
    tags: ["gleam-v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gleam
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28"
          gleam-version: "1.17.0"
          rebar3-version: "3"
      - name: Tag matches the version in gleam.toml
        run: |
          vsn=$(sed -n 's/^version = "\(.*\)"/\1/p' gleam.toml)
          test "gleam-v$vsn" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package version gleam-v$vsn"; exit 1; }
      - run: gleam deps download
      - run: gleam format --check src test
      - run: gleam test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Holds HEX_API_KEY; the environment requires a reviewer to approve.
    environment: hex
    permissions:
      contents: write
    defaults:
      run:
        working-directory: gleam
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28"
          gleam-version: "1.17.0"
          rebar3-version: "3"
      - run: gleam deps download
      - name: Publish to Hex
        env:
          HEXPM_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: gleam publish --yes
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
