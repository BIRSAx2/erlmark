name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ["27", "28", "29"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: "3"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: rebar3-${{ matrix.otp }}-${{ hashFiles('rebar.config', 'rebar.lock') }}
      - run: rebar3 compile
      - run: rebar3 fmt --check
      - run: rebar3 eunit
      - run: rebar3 dialyzer

  versions:
    name: Package versions in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          erl_vsn=$(sed -n 's/.*{vsn, "\(.*\)"}.*/\1/p' src/erlmark.app.src)
          ex_vsn=$(sed -n 's/^ *@version "\(.*\)"/\1/p' elixir/mix.exs)
          gl_vsn=$(sed -n 's/^version = "\(.*\)"/\1/p' gleam/gleam.toml)
          gl_dep=$(sed -n 's/^erlmark = "== \(.*\)"/\1/p' gleam/gleam.toml)
          echo "erlmark=$erl_vsn erlmark_ex=$ex_vsn erlmark_gleam=$gl_vsn (depends on erlmark $gl_dep)"
          test "$ex_vsn" = "$erl_vsn" && test "$gl_vsn" = "$erl_vsn" && test "$gl_dep" = "$erl_vsn"
