name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otp: ["27", "28", "29"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: "3"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            _build
            ~/.cache/rebar3
          key: rebar3-${{ matrix.otp }}-${{ hashFiles('rebar.config', 'rebar.lock') }}
      - run: rebar3 compile
      - run: rebar3 fmt --check
      - run: rebar3 eunit
      - run: rebar3 dialyzer
