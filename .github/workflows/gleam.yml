name: Gleam

on:
  push:
    branches: [main]
    paths: ["gleam/**", ".github/workflows/gleam.yml"]
  pull_request:
    paths: ["gleam/**", ".github/workflows/gleam.yml"]

permissions:
  contents: read

concurrency:
  group: gleam-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Gleam / OTP ${{ matrix.otp }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gleam
    strategy:
      fail-fast: false
      matrix:
        otp: ["27", "28"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ matrix.otp }}
          gleam-version: "1.17.0"
          rebar3-version: "3"
      # The committed requirement pins this repository's version, which is not on Hex until
      # release. Resolve against the latest published erlmark, then replace its sources with
      # the ones in this checkout so the wrapper is tested against the current core.
      - run: sed -i 's/^erlmark = .*/erlmark = ">= 0.1.1 and < 1.0.0"/' gleam.toml
      - run: gleam deps download
      - run: |
          rm -rf build/packages/erlmark/src build/packages/erlmark/include
          cp -R ../src ../include build/packages/erlmark/
      - run: gleam format --check src test
      - run: gleam test
