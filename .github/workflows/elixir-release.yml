name: Release Elixir package

on:
  push:
    tags: ["elixir-v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elixir
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28"
          elixir-version: "1.19"
          rebar3-version: "3"
      - name: Tag matches the version in mix.exs
        run: |
          vsn=$(sed -n 's/^ *@version "\(.*\)"/\1/p' mix.exs)
          test "elixir-v$vsn" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package version elixir-v$vsn"; exit 1; }
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Holds HEX_API_KEY; the environment requires a reviewer to approve.
    environment: hex
    permissions:
      contents: write
    defaults:
      run:
        working-directory: elixir
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28"
          elixir-version: "1.19"
          rebar3-version: "3"
      - run: mix deps.get
      - name: Publish to Hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag
